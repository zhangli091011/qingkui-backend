name: backend-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: test
      DATABASE_URL: sqlite:///./ci-migration.db
      JWT_SECRET: ci-only-secret-at-least-32-characters
      AI_PROVIDER: stub
      RETRIEVAL_PROVIDER: lexical
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest
      - name: Upgrade empty database
        run: alembic upgrade head
      - name: Verify downgrade path
        run: alembic downgrade base
      - name: Verify second upgrade
        run: alembic upgrade head
