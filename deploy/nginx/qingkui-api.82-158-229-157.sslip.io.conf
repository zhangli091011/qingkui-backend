server {
    listen 80;
    listen [::]:80;
    server_name qingkui-api.82-158-229-157.sslip.io;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/qingkui-api-acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name qingkui-api.82-158-229-157.sslip.io;

    ssl_certificate /etc/letsencrypt/live/qingkui-api.82-158-229-157.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qingkui-api.82-158-229-157.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:QingkuiTLS:10m;

    client_max_body_size 24m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
