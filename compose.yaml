services:
  vector-sync:
    build: .
    command: ["python", "-m", "app.cli", "sync-vector-index-from-oss", "--allow-stale"]
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://qingkui:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/qingkui
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      OSS_BUCKET: ${OSS_BUCKET:-qingkui-yuhua}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-https://oss-cn-qingdao.aliyuncs.com}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_VECTOR_OBJECT_KEY: ${OSS_VECTOR_OBJECT_KEY:-knowledge/index/qingkui-vectors.npz}
      OSS_VECTOR_POINTER_KEY: ${OSS_VECTOR_POINTER_KEY:-knowledge/index/current.json}
      RETRIEVAL_VECTOR_INDEX_PATH: /data/qingkui-vectors.npz
    volumes:
      - ${QINGKUI_VECTOR_DATA_HOST_PATH:-./data}:/data
    restart: "no"

  api:
    build: .
    ports:
      - "${QINGKUI_BIND_ADDRESS:-0.0.0.0}:${QINGKUI_PORT:-8000}:8000"
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://qingkui:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/qingkui
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?Set DEEPSEEK_API_KEY}
      DEEPSEEK_MODEL: deepseek-v4-flash
      RETRIEVAL_PROVIDER: ${RETRIEVAL_PROVIDER:-lexical}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com}
      DASHSCOPE_API_MODE: ${DASHSCOPE_API_MODE:-native}
      DASHSCOPE_EMBEDDING_MODEL: ${DASHSCOPE_EMBEDDING_MODEL:-text-embedding-v4}
      DASHSCOPE_OCR_MODEL: ${DASHSCOPE_OCR_MODEL:-qwen3.5-ocr}
      DASHSCOPE_RERANK_MODEL: ${DASHSCOPE_RERANK_MODEL:-gte-rerank-v2}
      DASHSCOPE_RERANK_ENABLED: ${DASHSCOPE_RERANK_ENABLED:-true}
      RETRIEVAL_VECTOR_INDEX_PATH: /data/qingkui-vectors.npz
      CONTENT_ENFORCE_LAUNCH_SCOPE: ${CONTENT_ENFORCE_LAUNCH_SCOPE:-true}
      CONTENT_LAUNCH_SUBJECT: ${CONTENT_LAUNCH_SUBJECT:-数学}
      CONTENT_LAUNCH_GRADE: ${CONTENT_LAUNCH_GRADE:-高一}
      CONTENT_LAUNCH_TEXTBOOK_VERSION: ${CONTENT_LAUNCH_TEXTBOOK_VERSION:-人教A版}
      OSS_BUCKET: ${OSS_BUCKET:-qingkui-yuhua}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-https://oss-cn-qingdao.aliyuncs.com}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_USER_CONTENT_PREFIX: ${OSS_USER_CONTENT_PREFIX:-user-content/mistakes}
      REDIS_URL: redis://redis:6379/0
      OCR_QUEUE_PROVIDER: redis
    volumes:
      - ${QINGKUI_VECTOR_DATA_HOST_PATH:-./data}:/data:ro
    depends_on:
      vector-sync:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  ocr-worker:
    build: .
    command: ["python", "-m", "app.worker"]
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://qingkui:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/qingkui
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?Set DASHSCOPE_API_KEY}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com}
      DASHSCOPE_API_MODE: ${DASHSCOPE_API_MODE:-native}
      DASHSCOPE_OCR_MODEL: ${DASHSCOPE_OCR_MODEL:-qwen3.5-ocr}
      OSS_BUCKET: ${OSS_BUCKET:-qingkui-yuhua}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-https://oss-cn-qingdao.aliyuncs.com}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_USER_CONTENT_PREFIX: ${OSS_USER_CONTENT_PREFIX:-user-content/mistakes}
      REDIS_URL: redis://redis:6379/0
      OCR_QUEUE_PROVIDER: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: qingkui
      POSTGRES_USER: qingkui
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qingkui"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
