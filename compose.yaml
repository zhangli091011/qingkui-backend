services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://qingkui:qingkui@postgres:5432/qingkui
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?Set DEEPSEEK_API_KEY}
      DEEPSEEK_MODEL: deepseek-v4-flash
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: qingkui
      POSTGRES_USER: qingkui
      POSTGRES_PASSWORD: qingkui
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qingkui"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: qingkui
      MINIO_ROOT_PASSWORD: change-this-before-deploy
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data:
