services:
  vector-sync:
    build: .
    command: ["python", "-m", "app.cli", "sync-vector-index-from-oss", "--allow-stale"]
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://qingkui:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/qingkui
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-disabled}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      OSS_BUCKET: ${OSS_BUCKET:-qingkui-yuhua}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-https://oss-cn-qingdao.aliyuncs.com}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_VECTOR_OBJECT_KEY: ${OSS_VECTOR_OBJECT_KEY:-knowledge/index/qingkui-vectors.npz}
      OSS_VECTOR_POINTER_KEY: ${OSS_VECTOR_POINTER_KEY:-knowledge/index/current.json}
      RETRIEVAL_VECTOR_INDEX_PATH: /data/qingkui-vectors.npz
    volumes:
      - ${QINGKUI_VECTOR_DATA_HOST_PATH:-./data}:/data
    restart: "no"

  api:
    build: .
    ports:
      - "${QINGKUI_BIND_ADDRESS:-0.0.0.0}:${QINGKUI_PORT:-8000}:8000"
    environment:
      APP_ENV: production
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      PRIVACY_NOTICE_VERSION: ${PRIVACY_NOTICE_VERSION:-2026-08-31}
      PRIVACY_CONSENT_ENFORCED: ${PRIVACY_CONSENT_ENFORCED:-false}
      AI_ENABLED: ${AI_ENABLED:-true}
      DATABASE_URL: postgresql+psycopg://qingkui:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/qingkui
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?Set DEEPSEEK_API_KEY}
      DEEPSEEK_MODEL: deepseek-v4-flash
      RETRIEVAL_PROVIDER: ${RETRIEVAL_PROVIDER:-lexical}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com}
      DASHSCOPE_API_MODE: ${DASHSCOPE_API_MODE:-native}
      DASHSCOPE_EMBEDDING_MODEL: ${DASHSCOPE_EMBEDDING_MODEL:-text-embedding-v4}
      DASHSCOPE_OCR_MODEL: ${DASHSCOPE_OCR_MODEL:-qwen3.5-ocr}
      DASHSCOPE_RERANK_MODEL: ${DASHSCOPE_RERANK_MODEL:-gte-rerank-v2}
      DASHSCOPE_RERANK_ENABLED: ${DASHSCOPE_RERANK_ENABLED:-true}
      RETRIEVAL_VECTOR_INDEX_PATH: /data/qingkui-vectors.npz
      CONTENT_ENFORCE_LAUNCH_SCOPE: ${CONTENT_ENFORCE_LAUNCH_SCOPE:-true}
      CONTENT_LAUNCH_SUBJECT: ${CONTENT_LAUNCH_SUBJECT:-数学}
      CONTENT_LAUNCH_GRADE: ${CONTENT_LAUNCH_GRADE:-高一}
      CONTENT_LAUNCH_TEXTBOOK_VERSION: ${CONTENT_LAUNCH_TEXTBOOK_VERSION:-人教A版}
      OSS_BUCKET: ${OSS_BUCKET:-qingkui-yuhua}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-https://oss-cn-qingdao.aliyuncs.com}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_USER_CONTENT_PREFIX: ${OSS_USER_CONTENT_PREFIX:-user-content/mistakes}
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_DEFAULT_PER_MINUTE: ${RATE_LIMIT_DEFAULT_PER_MINUTE:-120}
      RATE_LIMIT_AUTH_PER_MINUTE: ${RATE_LIMIT_AUTH_PER_MINUTE:-10}
      RATE_LIMIT_AI_PER_MINUTE: ${RATE_LIMIT_AI_PER_MINUTE:-30}
      RATE_LIMIT_UPLOAD_PER_MINUTE: ${RATE_LIMIT_UPLOAD_PER_MINUTE:-20}
      RATE_LIMIT_TRUST_PROXY_HEADERS: ${RATE_LIMIT_TRUST_PROXY_HEADERS:-true}
      OPERATIONAL_ALERT_WEBHOOK_URL: ${OPERATIONAL_ALERT_WEBHOOK_URL:-}
      OPERATIONAL_ALERT_WEBHOOK_TIMEOUT_SECONDS: ${OPERATIONAL_ALERT_WEBHOOK_TIMEOUT_SECONDS:-5}
      OPERATIONAL_ALERT_COOLDOWN_MINUTES: ${OPERATIONAL_ALERT_COOLDOWN_MINUTES:-60}
      OCR_QUEUE_PROVIDER: redis
      ORGANIZATIONS_ENABLED: ${ORGANIZATIONS_ENABLED:-false}
      PILOT_AUTHORIZATION_ENFORCED: ${PILOT_AUTHORIZATION_ENFORCED:-false}
      CREDIT_CAMPAIGNS_ENABLED: ${CREDIT_CAMPAIGNS_ENABLED:-false}
      CONTRIBUTIONS_ENABLED: ${CONTRIBUTIONS_ENABLED:-false}
      CONTRIBUTION_REWARDS_ENABLED: ${CONTRIBUTION_REWARDS_ENABLED:-false}
      CONTRIBUTION_REWARD_DELAY_HOURS: ${CONTRIBUTION_REWARD_DELAY_HOURS:-168}
      CONTRIBUTION_QUEUE_PROVIDER: redis
      CONTRIBUTION_QUEUE_NAME: ${CONTRIBUTION_QUEUE_NAME:-qingkui-contributions}
    volumes:
      - ${QINGKUI_VECTOR_DATA_HOST_PATH:-./data}:/data:ro
    depends_on:
      vector-sync:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)); assert data['status'] == 'ok'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 30s
    restart: unless-stopped

  ocr-worker:
    build: .
    command: ["python", "-m", "app.worker"]
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://qingkui:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/qingkui
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?Set DASHSCOPE_API_KEY}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com}
      DASHSCOPE_API_MODE: ${DASHSCOPE_API_MODE:-native}
      DASHSCOPE_OCR_MODEL: ${DASHSCOPE_OCR_MODEL:-qwen3.5-ocr}
      OSS_BUCKET: ${OSS_BUCKET:-qingkui-yuhua}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-https://oss-cn-qingdao.aliyuncs.com}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_USER_CONTENT_PREFIX: ${OSS_USER_CONTENT_PREFIX:-user-content/mistakes}
      REDIS_URL: redis://redis:6379/0
      OCR_QUEUE_PROVIDER: redis
      CONTRIBUTION_QUEUE_NAME: ${CONTRIBUTION_QUEUE_NAME:-qingkui-contributions}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: qingkui
      POSTGRES_USER: qingkui
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qingkui"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
